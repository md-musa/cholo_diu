services:
  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db

  server:
    build:
      context: ./server
    ports:
      - "4000:4000"
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: mongodb://mongo:27017/cholo-diu
    volumes:
      - ./server/.env:/app/production.env:ro
    depends_on:
      - mongo

  admin:
    build:
      context: ./admin
      args:
        VITE_API_URL: http://localhost:4000/api/v1
    ports:
      - "8080:80"

volumes:
  mongo_data:
